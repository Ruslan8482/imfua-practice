name: "CD: Go GUI (Fyne) binaries to Releases"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CGO_ENABLED: "1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: ci-cd/pipelines/go-gui-bin/go.mod

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgl1-mesa-dev xorg-dev

      - name: Resolve dependencies
        working-directory: ci-cd/pipelines/go-gui-bin
        run: go mod tidy

      - name: Check formatting
        working-directory: ci-cd/pipelines/go-gui-bin
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Не отформатированы:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        working-directory: ci-cd/pipelines/go-gui-bin
        run: go vet ./...

      - name: Run tests
        working-directory: ci-cd/pipelines/go-gui-bin
        run: go test -v ./...

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: go-gui-bin
            asset: "go-gui-bin-${{ github.ref_name }}-linux-amd64.tar.gz"
          - os: macos-latest
            binary: go-gui-bin
            asset: "go-gui-bin-${{ github.ref_name }}-macos-amd64.tar.gz"
          - os: windows-latest
            binary: go-gui-bin.exe
            asset: "go-gui-bin-${{ github.ref_name }}-windows-amd64.zip"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: ci-cd/pipelines/go-gui-bin/go.mod

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgl1-mesa-dev xorg-dev

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Find C compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @('C:\msys64\mingw64\bin\gcc.exe', 'C:\msys64\ucrt64\bin\gcc.exe')
          $gcc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $gcc) { throw "gcc.exe не найден" }
          "CC=$gcc" >> $env:GITHUB_ENV

      - name: Resolve dependencies
        working-directory: ci-cd/pipelines/go-gui-bin
        run: go mod tidy

      - name: Build
        working-directory: ci-cd/pipelines/go-gui-bin
        run: go build -trimpath -o "${{ matrix.binary }}" .

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        working-directory: ci-cd/pipelines/go-gui-bin
        run: |
          mkdir -p out
          tar -czf "out/${{ matrix.asset }}" "${{ matrix.binary }}"

      - name: Package (zip)
        if: runner.os == 'Windows'
        working-directory: ci-cd/pipelines/go-gui-bin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path "${{ matrix.binary }}" -DestinationPath "out/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-gui-bin-${{ matrix.os }}
          path: ci-cd/pipelines/go-gui-bin/out/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
