name: "CD: Python PyInstaller binaries to Releases"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci-cd/pipelines/python-pyinstaller-bin/requirements.txt

      - name: Install dependencies
        working-directory: ci-cd/pipelines/python-pyinstaller-bin
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ci-cd/pipelines/python-pyinstaller-bin
        run: python -m pytest -v

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: cli
            asset: "python-cli-${{ github.ref_name }}-linux.tar.gz"
          - os: macos-latest
            binary: cli
            asset: "python-cli-${{ github.ref_name }}-macos.tar.gz"
          - os: windows-latest
            binary: cli.exe
            asset: "python-cli-${{ github.ref_name }}-windows.zip"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci-cd/pipelines/python-pyinstaller-bin/requirements.txt

      - name: Install dependencies
        working-directory: ci-cd/pipelines/python-pyinstaller-bin
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        working-directory: ci-cd/pipelines/python-pyinstaller-bin
        run: python -m PyInstaller --onefile --name cli src/cli.py

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        working-directory: ci-cd/pipelines/python-pyinstaller-bin
        run: |
          mkdir -p out
          tar -czf "out/${{ matrix.asset }}" -C dist "${{ matrix.binary }}"

      - name: Package (zip)
        if: runner.os == 'Windows'
        working-directory: ci-cd/pipelines/python-pyinstaller-bin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path "dist/${{ matrix.binary }}" -DestinationPath "out/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-cli-${{ matrix.os }}
          path: ci-cd/pipelines/python-pyinstaller-bin/out/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
