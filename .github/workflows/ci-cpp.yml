name: "CI: C++"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (CMake/CTest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ clang-format

      - name: Configure
        run: cmake -S ci-cd/pipelines/cpp -B ci-cd/pipelines/cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build ci-cd/pipelines/cpp/build --parallel

      - name: Check formatting
        run: |
          find ci-cd/pipelines/cpp/src ci-cd/pipelines/cpp/tests \
            \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Test
        run: ctest --test-dir ci-cd/pipelines/cpp/build --output-on-failure

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cpp-hello
          path: ci-cd/pipelines/cpp/build/hello-cpp
          if-no-files-found: error
