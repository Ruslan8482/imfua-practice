name: "CI: PHP + MySQL"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          tools: composer

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('ci-cd/pipelines/php-mysql/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        working-directory: ci-cd/pipelines/php-mysql
        run: composer validate --no-check-all --strict || true

      - name: Check PHP syntax
        working-directory: ci-cd/pipelines/php-mysql
        run: |
          find src -name '*.php' -exec php -l {} \;
          find tests -name '*.php' -exec php -l {} \;

  test:
    name: PHPUnit with MySQL
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          tools: composer

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('ci-cd/pipelines/php-mysql/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: ci-cd/pipelines/php-mysql
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check MySQL connection
        run: |
          php -r '
          $db = new mysqli("127.0.0.1", "root", "root", "app_test", 3306);
          if ($db->connect_error) {
              fwrite(STDERR, $db->connect_error . PHP_EOL);
              exit(1);
          }
          echo "MySQL OK" . PHP_EOL;
          '

      - name: Run PHPUnit
        working-directory: ci-cd/pipelines/php-mysql
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: app_test
        run: vendor/bin/phpunit --colors=never
