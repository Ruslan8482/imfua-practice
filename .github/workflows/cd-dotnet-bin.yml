name: "CD: .NET CLI binaries to Releases"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: ci-cd/pipelines/dotnet-bin
        run: dotnet restore HelloCli.sln

      - name: Test
        working-directory: ci-cd/pipelines/dotnet-bin
        run: dotnet test HelloCli.sln --no-restore -c Release

  build:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            binary: hello-dotnet
          - rid: linux-arm64
            binary: hello-dotnet
          - rid: osx-x64
            binary: hello-dotnet
          - rid: osx-arm64
            binary: hello-dotnet
          - rid: win-x64
            binary: hello-dotnet.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        working-directory: ci-cd/pipelines/dotnet-bin
        run: |
          dotnet publish HelloCli/HelloCli.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -o "out/${{ matrix.rid }}"

      - name: Package (tar.gz)
        if: matrix.rid != 'win-x64'
        working-directory: ci-cd/pipelines/dotnet-bin
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/hello-dotnet-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz" -C "out/${{ matrix.rid }}" "${{ matrix.binary }}"

      - name: Package (zip)
        if: matrix.rid == 'win-x64'
        working-directory: ci-cd/pipelines/dotnet-bin
        run: |
          mkdir -p artifacts
          zip -j "artifacts/hello-dotnet-${{ github.ref_name }}-${{ matrix.rid }}.zip" "out/${{ matrix.rid }}/${{ matrix.binary }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-${{ matrix.rid }}
          path: ci-cd/pipelines/dotnet-bin/artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
