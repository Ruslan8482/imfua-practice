name: "CI: Hello"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello:
    name: Приветствие и проверка скрипта
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Запуск hello.sh
        working-directory: ci-cd/pipelines/hello
        run: bash hello.sh

      - name: Тест вывода
        working-directory: ci-cd/pipelines/hello
        run: bash tests/test_hello.sh
