name: "CI: Go"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: ci-cd/pipelines/go/go.mod

      - name: Download dependencies
        working-directory: ci-cd/pipelines/go
        run: go mod download

      - name: Format check
        working-directory: ci-cd/pipelines/go
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Не отформатированы:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        working-directory: ci-cd/pipelines/go
        run: go vet ./...

      - name: Run tests with coverage
        working-directory: ci-cd/pipelines/go
        run: go test -v -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: ci-cd/pipelines/go/coverage.out

  docker-build:
    name: Build Docker Image (no push)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ci-cd/pipelines/go
          load: true
          tags: my-go-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: docker run --rm my-go-app:test
