name: "CD: Static site to GitHub Pages"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-static-site
  cancel-in-progress: true

jobs:
  ci:
    name: Validate HTML/CSS/JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-static-${{ hashFiles('ci-cd/pipelines/static-site-pages/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-static-

      - name: Install dependencies
        working-directory: ci-cd/pipelines/static-site-pages
        run: npm install --no-audit --no-fund

      - name: Validate
        working-directory: ci-cd/pipelines/static-site-pages
        run: npm run validate

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ci-cd/pipelines/static-site-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
