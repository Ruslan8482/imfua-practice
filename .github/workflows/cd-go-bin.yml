name: "CD: Go CLI binaries to Releases"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: ci-cd/pipelines/go-bin/go.mod

      - name: Check formatting
        working-directory: ci-cd/pipelines/go-bin
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Не отформатированы:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        working-directory: ci-cd/pipelines/go-bin
        run: go vet ./...

      - name: Run tests
        working-directory: ci-cd/pipelines/go-bin
        run: go test -v ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: go-bin
            asset: "go-bin-${{ github.ref_name }}-linux-amd64.tar.gz"
          - goos: linux
            goarch: arm64
            binary: go-bin
            asset: "go-bin-${{ github.ref_name }}-linux-arm64.tar.gz"
          - goos: darwin
            goarch: amd64
            binary: go-bin
            asset: "go-bin-${{ github.ref_name }}-darwin-amd64.tar.gz"
          - goos: darwin
            goarch: arm64
            binary: go-bin
            asset: "go-bin-${{ github.ref_name }}-darwin-arm64.tar.gz"
          - goos: windows
            goarch: amd64
            binary: go-bin.exe
            asset: "go-bin-${{ github.ref_name }}-windows-amd64.zip"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: ci-cd/pipelines/go-bin/go.mod

      - name: Build
        working-directory: ci-cd/pipelines/go-bin
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-X main.version=${{ github.ref_name }}" -o "dist/${{ matrix.binary }}" .

      - name: Package (tar.gz)
        if: matrix.goos != 'windows'
        working-directory: ci-cd/pipelines/go-bin
        run: |
          mkdir -p out
          tar -czf "out/${{ matrix.asset }}" -C dist "${{ matrix.binary }}"

      - name: Package (zip)
        if: matrix.goos == 'windows'
        working-directory: ci-cd/pipelines/go-bin
        run: |
          mkdir -p out
          zip -j "out/${{ matrix.asset }}" "dist/${{ matrix.binary }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ci-cd/pipelines/go-bin/out/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
