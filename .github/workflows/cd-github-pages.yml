name: "CD: React SPA to GitHub Pages"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-react-spa
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-spa-${{ hashFiles('ci-cd/pipelines/github-pages/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-spa-

      - name: Install dependencies
        working-directory: ci-cd/pipelines/github-pages
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: ci-cd/pipelines/github-pages
        run: npm run typecheck

      - name: Test
        working-directory: ci-cd/pipelines/github-pages
        run: npm test

      - name: Build
        working-directory: ci-cd/pipelines/github-pages
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ci-cd/pipelines/github-pages/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
