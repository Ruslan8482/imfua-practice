name: imfua-drawdb

services:
  drawdb:
    image: ${DRAWDB_IMAGE:-node:20-alpine}
    container_name: drawdb
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "${DRAWDB_PORT:-5173}:5173"
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
      VITE_GIST_BACKEND_URL: ${VITE_GIST_BACKEND_URL:-}
    volumes:
      # Исходники апстрима монтируются в контейнер (как в compose.yml проекта drawDB).
      - ./app:/var/www/html
    networks:
      - drawdb-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

networks:
  drawdb-network:
    driver: bridge
