name: imfua-homehub

services:
  homehub:
    image: ${HOMEHUB_IMAGE:-ghcr.io/surajverma/homehub:latest}
    container_name: homehub
    restart: unless-stopped
    ports:
      - "${HOMEHUB_PORT:-5000}:5000"
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    volumes:
      - ./uploads:/app/uploads
      - ./media:/app/media
      - ./pdfs:/app/pdfs
      - ./data:/app/data
      - ./config.yml:/app/config.yml:ro
    networks:
      - homehub-network
    healthcheck:
      test: ["CMD-SHELL", "(python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000', timeout=5)\" || python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000', timeout=5)\") || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  homehub-network:
    driver: bridge
