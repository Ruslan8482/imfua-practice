services:
  db:
    build: .
    image: imfua-postgres:local
    container_name: imfua-pg-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  cloudbeaver:
    image: ghcr.io/dbeaver/cloudbeaver:latest
    container_name: imfua-cloudbeaver
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${CLOUDBEAVER_PORT:-8978}:8978"
    volumes:
      - cb_data:/opt/cloudbeaver/workspace

volumes:
  pg_data:
  cb_data:
